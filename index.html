<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>須田建装</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.9/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.9/firebase-database.js"></script>
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      color: #333;
    }

    /* ヘッダーのデザイン */
    header {
      background-color: #2c3e50;
      color: white;
      padding: 50px 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      font-size: 40px;
      margin: 0;
    }
    header p {
      font-size: 20px;
      margin-top: 10px;
    }

    /* セクションごとのデザイン */
    section {
      padding: 30px;
      margin: 20px auto;
      max-width: 1200px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }
    section:hover {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    .section-content p {
      font-size: 18px;
      line-height: 1.6;
    }

    /* 画像や写真のスタイル */
    .section-content img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 15px;
    }
    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    /* フォームのデザイン */
    form input, form textarea, form button {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    form button {
      background-color: #4CAF50;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s ease;
    }

    form button:hover {
      background-color: #45a049;
    }

    /* フッターのデザイン */
    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 50px;
      position: relative;
    }

    footer h3 {
      font-size: 28px;
      margin: 0;
    }

    footer p {
      font-size: 18px;
      margin: 10px 0;
    }
    
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>須田建装</h1>
    <p>内装業の専門会社</p>
  </header>

  <!-- 会社概要 -->
  <section id="company">
    <h2>会社概要</h2>
    <div class="section-content">
      <p><strong>事業内容:</strong> 内装工事、リフォーム、修繕など</p>
      <p><strong>沿革:</strong> 2000年創業、地域に根付いた内装業</p>
      <p><strong>資格情報:</strong> 施工管理技士、インテリアコーディネーター資格保持</p>
      <p><strong>写真:</strong> <img src="your-photo.jpg" alt="施工写真"></p>
    </div>
  </section>

  <!-- 私たちの想い -->
  <section id="philosophy">
    <h2>私たちの想い</h2>
    <div class="section-content">
      <p>お客様の生活空間をより快適にするために、常に品質を第一に考えています。お客様との信頼関係を大切にし、丁寧な施工を心掛けています。</p>
    </div>
  </section>

  <!-- 施工事例 -->
  <section id="projects">
    <h2>施工事例</h2>
    <div class="section-content">
      <p>多くの実績がございます。施工例をご覧ください。</p>
      <img src="project1.jpg" alt="施工事例1">
      <img src="project2.jpg" alt="施工事例2">
    </div>
  </section>

  <!-- お問い合わせフォーム -->
  <section id="contact">
    <h2>お問い合わせ</h2>
    <form id="contact-form">
      <label for="name">名前:</label>
      <input type="text" id="name" required><br>

      <label for="phone">電話番号:</label>
      <input type="text" id="phone" required><br>

      <label for="content">依頼内容:</label>
      <textarea id="content" required></textarea><br>

      <button type="submit">送信</button>
    </form>
  </section>

  <!-- フッター -->
  <footer>
    <h3>須田武</h3>
    <p>電話番号: 090-1234-5678</p>
    <img src="IMG_1483.HEIC" alt="須田武" class="photo">
  </footer>

  <!-- Firebase 初期化 -->
  <script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.6.9/firebase-app.js';
  import { getDatabase, ref, set, push } from 'https://www.gstatic.com/firebasejs/9.6.9/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBTnKQqbJ1VwQQeH0TjsBLU9YciODfWz8o",
    authDomain: "kennkyuu-bb663.firebaseapp.com",
    databaseURL: "https://kennkyuu-bb663-default-rtdb.firebaseio.com",
    projectId: "kennkyuu-bb663",
    storageBucket: "kennkyuu-bb663.firebasestorage.app",
    messagingSenderId: "697200030354",
    appId: "1:697200030354:web:84ebd55d17c8b1ced1ec4b",
    measurementId: "G-Z0Y30DLBKZ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  document.getElementById('contact-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const content = document.getElementById('content').value;

    const newRequestRef = push(ref(db, 'requests'));
    set(newRequestRef, {
      name: name,
      phone: phone,
      content: content,
      timestamp: Date.now()
    })
    .then(() => {
      alert("データ送信成功！");
    })
    .catch((error) => {
      console.error("データ送信エラー: ", error);
      alert("送信エラーが発生しました。");
    });
  });
  </script>

</body>
</html>
